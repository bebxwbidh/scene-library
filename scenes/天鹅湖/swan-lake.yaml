# 场景：天鹅湖（雪山蓝湖+天鹅海鸥+碎石岸）
source: 用户提供的4K横版场景图
size: 3840x2160

## 环境标签
terrain: [碎石湖岸, 开阔湖面]
sky_ratio: 0.25
ground_type: [碎石, 砾石滩]
openness: 高
water: 湖面（天鹅海鸥为场景生物元素，禁拟人变形）
props: 天鹅、海鸥（场景自带，不要额外加花拱门/花瓣等人工布置）

## 光线标签
weather: 晴天
color_temp: 5600K 冷调（湖蓝+雪山白），婚纱白为画面亮点
light_direction: 午后顺侧光

## 适配标签
outfit_ok: [拖尾婚纱, 齐地纱, 便装]
outfit_warn:
  - 碎石岸 × 拖尾婚纱：拖尾贴碎石易脏，写"裙摆铺碎石上"需接受质感；禁坐/卧
  - 岸边水浅：可拍 A3 踢水帧，须写"裙摆提起"
pose_ok: [公主抱(实测成功), 并肩站立, 漫步, 指向湖面]
best_framing: 竖全景（人物居中+湖面天鹅散布），横全景（大场景）

## 风险标签（已知判废点）
risks:
  - 3参考图(人物+姿势+场景)+high档：1536x2048 必超时，用 1024x1536 出图
  - 天鹅数量会被改动/增多 → 负面写"天鹅海鸥不拟人不变形"，不写具体数量
  - 模型可能自动加花拱门/花瓣 → 必须负面排除"不要花拱门、不要花瓣、不要布置道具"
